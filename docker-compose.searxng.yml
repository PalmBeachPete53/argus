# Minimal SearXNG instance for Argus Search Discovery fallback.
#
# Optional: Argus works entirely without it. When enabled, SearXNG must expose
# its JSON API (search.formats must include "json" in /etc/searxng/settings.yml).
#
#   docker compose -f docker-compose.searxng.yml up -d
#   export SEARCH_PROVIDER=searxng
#   export SEARXNG_BASE_URL=http://localhost:8080/
#
services:
  searxng:
    image: searxng/searxng:latest
    ports:
      - "8080:8080"
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
    volumes:
      - ./searxng:/etc/searxng
    restart: unless-stopped
